# Pages project aiva-trading serves aivatrading.uk, www.aivatrading.uk and app.aivatrading.uk.
# Production deploys run only from main (.github/workflows/deploy-production.yml).
# Static design and legacy providers are preserved; encrypted keys never enter assets.
# Square production; live charges approved by the owner.
name = "aiva-trading"
compatibility_date = "2025-11-01"
pages_build_output_dir = ".pages-output"

# Keep plain vars in wrangler.toml so `wrangler pages deploy` does not wipe them.
[vars]
CHECKOUT_PROVIDER = "square"
SQUARE_ENVIRONMENT = "production"
# Live charges approved by the owner on 2026-11-19. Production credentials are the SQUARE_PRODUCTION_* Pages secrets.
SQUARE_LIVE_PAYMENTS_APPROVED = "true"
# Shopify: set CHECKOUT_PROVIDER = "shopify" once the Shopify test checkout passes.
# Secrets (Pages, never committed): SHOPIFY_STOREFRONT_TOKEN, SHOPIFY_WEBHOOK_SECRET, SHOPIFY_ADMIN_TOKEN.
SHOPIFY_STORE_DOMAIN = ""
SHOPIFY_API_VERSION = "2026-10"
SHOPIFY_LIVE_PAYMENTS_APPROVED = "false"
# Shopify test mode only after the owner confirms the store uses a test gateway (Bogus Gateway / Shopify Payments test mode).
SHOPIFY_TEST_GATEWAY_CONFIRMED = "false"
SQUARE_WEBHOOK_NOTIFICATION_URL = "https://app.aivatrading.uk/api/square-webhook"
MERCHANT_SUPPORT_EMAIL = "Aivatradingltd2026@gmail.com"
# Aiva Crypto Pay (BTC, ETH, USDT, USDC, LTC, SOL via BitPay), shared by aivatrading.uk and app.aivatrading.uk.
# Secret (Pages, never committed): BITPAY_TOKEN (BitPay POS-facade API token). "test" = test.bitpay.com, no real money.
# Live: BITPAY_ENV = "prod" plus CRYPTO_LIVE_PAYMENTS_APPROVED = "true", only after BitPay merchant approval and a passed test run.
BITPAY_ENV = "test"
CRYPTO_LIVE_PAYMENTS_APPROVED = "false"

[[d1_databases]]
binding = "ORDERS_DB"
database_name = "aiva_orders"
database_id = "d6791133-c5f2-4209-a9ab-91573e123939"
