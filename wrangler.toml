# Existing Pages project. Verified domain: app.aivatrading.uk, NOT the requested apex.
# Root promotion must verify the custom domain first: scripts/promote-production.mjs.
# Static design and legacy providers are preserved; encrypted keys never enter assets.
# Square sandbox only; production charges stay disabled until approved.
name = "aiva-trading"
compatibility_date = "2025-11-01"
pages_build_output_dir = ".pages-output"

# Keep plain vars in wrangler.toml so `wrangler pages deploy` does not wipe them.
[vars]
CHECKOUT_PROVIDER = "square"
SQUARE_ENVIRONMENT = "sandbox"
# Real charges need SQUARE_ENVIRONMENT="production" AND this flag set to "true" after owner approval.
SQUARE_LIVE_PAYMENTS_APPROVED = "false"
SQUARE_WEBHOOK_NOTIFICATION_URL = "https://app.aivatrading.uk/api/square-webhook"
MERCHANT_SUPPORT_EMAIL = "Aivatradingltd2026@gmail.com"

[[d1_databases]]
binding = "ORDERS_DB"
database_name = "aiva_orders"
database_id = "d6791133-c5f2-4209-a9ab-91573e123939"
