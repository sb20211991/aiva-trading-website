# Find where aivatrading.uk is attached in this Cloudflare account.
name: Cloudflare find apex domain owner
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/cloudflare-github-deploy-1f19
    paths:
      - '.github/workflows/cloudflare-find-apex.yml'
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect account bindings for aivatrading.uk
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          domain='aivatrading.uk'

          def call(url, method='GET', body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url, data=data, method=method, headers={
                'Authorization': f'Bearer {token}',
                'Content-Type': 'application/json',
                'User-Agent': 'aiva-find-apex/1.0',
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as res:
                      raw=res.read().decode()
                      return res.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode()
                  try: payload=json.loads(raw) if raw else {}
                  except Exception: payload={'raw': raw[:1000]}
                  return e.code, payload

          print('=== Pages projects ===')
          code, payload = call(f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects')
          print('HTTP', code, 'success', payload.get('success'))
          for p in payload.get('result') or []:
              print('PROJECT', p.get('name'), 'domains=', p.get('domains'))
              # list domains endpoint too
              c2, p2 = call(f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{p.get("name")}/domains')
              print('  domains endpoint HTTP', c2, (p2.get('result') if isinstance(p2, dict) else p2))

          print('=== Zones ===')
          code, payload = call('https://api.cloudflare.com/client/v4/zones?name=' + domain)
          print('HTTP', code, 'success', payload.get('success'))
          zones = payload.get('result') or []
          for z in zones:
              zid=z.get('id'); print('ZONE', z.get('name'), zid)
              # DNS records
              c2,p2=call(f'https://api.cloudflare.com/client/v4/zones/{zid}/dns_records?per_page=100')
              print(' DNS HTTP', c2)
              for r in p2.get('result') or []:
                  print('  DNS', r.get('type'), r.get('name'), '->', r.get('content'), 'proxied=', r.get('proxied'))
              # Worker routes
              c2,p2=call(f'https://api.cloudflare.com/client/v4/zones/{zid}/workers/routes')
              print(' Worker routes HTTP', c2)
              for r in p2.get('result') or []:
                  print('  ROUTE', r)
              # Custom hostnames / ssl for saas
              c2,p2=call(f'https://api.cloudflare.com/client/v4/zones/{zid}/custom_hostnames?per_page=50')
              print(' Custom hostnames HTTP', c2, 'count', len(p2.get('result') or []))

          print('=== Account workers scripts (names only) ===')
          code, payload = call(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts')
          print('HTTP', code, 'success', payload.get('success'))
          for s in payload.get('result') or []:
              print(' WORKER', s.get('id') or s.get('name') or s)

          print('=== Workers domains ===')
          code, payload = call(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/domains')
          print('HTTP', code, 'success', payload.get('success'))
          for d in payload.get('result') or []:
              print(' DOMAIN', d)
          PY
