name: Deploy production (aivatrading.uk)
# Every push to main is tested and deployed to the aiva-trading Pages project (aivatrading.uk + www).
# CHECKOUT_PROVIDER in wrangler.toml selects Shopify or Square. Payment Pages secrets arrive (manual dispatch with handoff=true) as deploy/handoff.enc, encrypted to a
# per-run RSA key whose private half never leaves the runner. Values are never printed. Never enables live payments.
# Provider end-to-end tests: scripts/square-sandbox-e2e.mjs and scripts/shopify-test-e2e.mjs.
on:
  workflow_dispatch:
    inputs:
      handoff:
        description: Wait for deploy/handoff.enc with Pages secrets
        type: boolean
        default: false
  push:
    branches: [main, devin/1763498400-square-checkout]
    paths-ignore: ['deploy/**']
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT: aiva-trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local checks
        run: npm test
      - name: Cloudflare diagnostics and attach aivatrading.uk + www
        env:
          DETACH_WORKER_DOMAINS: "1"
        run: python3 scripts/cloudflare-domains.py
      - name: Ephemeral key for encrypted handoff
        if: inputs.handoff
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k" handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/k/priv.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/k/priv.pem" -pubout -out handoff/pub.pem
          echo "$GITHUB_RUN_ID" > handoff/run_id
      - uses: actions/upload-artifact@v4
        if: inputs.handoff
        with:
          name: handoff-pubkey
          path: handoff/
      - name: Receive encrypted Pages secrets and install them (up to 12 min)
        if: inputs.handoff
        run: |
          set -uo pipefail
          for i in $(seq 1 48); do
            if git fetch -q origin "$GITHUB_REF_NAME" && git show "origin/$GITHUB_REF_NAME:deploy/run_id" 2>/dev/null | grep -qx "$GITHUB_RUN_ID"; then
              git show "origin/$GITHUB_REF_NAME:deploy/handoff.enc" | base64 -d | openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/k/priv.pem" \
                -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > "$RUNNER_TEMP/handoff.json" && break
            fi
            sleep 15
          done
          [ -s "$RUNNER_TEMP/handoff.json" ] || { echo "No handoff received."; exit 1; }
          python3 - "$RUNNER_TEMP/handoff.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          for v in d.values(): print("::add-mask::" + v)
          assert set(d) <= {"SQUARE_ACCESS_TOKEN", "SQUARE_LOCATION_ID", "SQUARE_WEBHOOK_SIGNATURE_KEY", "MERCHANT_ADMIN_KEY",
                            "SHOPIFY_STOREFRONT_TOKEN", "SHOPIFY_ADMIN_TOKEN", "SHOPIFY_WEBHOOK_SECRET"}, "unexpected keys"
          print("handoff keys:", sorted(d))
          PY
          npx --yes wrangler@4 pages secret bulk "$RUNNER_TEMP/handoff.json" --project-name="$PROJECT" > /dev/null && echo "Pages production secrets installed (values not printed)."
      - name: Deploy Pages production
        run: |
          set -euo pipefail
          node scripts/build-pages-assets.mjs
          npx --yes wrangler@4 pages deploy .pages-output --project-name="$PROJECT" --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-message="Production deploy ${GITHUB_SHA::7}" --commit-dirty=true
      - name: Verify endpoints
        run: |
          sleep 20
          for h in aivatrading.uk www.aivatrading.uk app.aivatrading.uk aiva-trading.pages.dev; do
            echo "== $h"; curl -s -m 20 -o /tmp/r -w "HTTP %{http_code} %{content_type}\n" "https://$h/api/shop-status"; head -c 700 /tmp/r; echo
            for p in /functions/_lib/commerce.js /wrangler.toml /ORDER-DATABASE-SETUP.sql /_worker.js /scripts/d1-migrate.sh; do
              printf '%s %s\n' "$p" "$(curl -s -m 15 -o /dev/null -w '%{http_code} %{content_type}' "https://$h$p")"
            done
          done
      - name: Remove local secret files
        if: always()
        run: rm -f "$RUNNER_TEMP"/handoff.json "$RUNNER_TEMP"/k/priv.pem
