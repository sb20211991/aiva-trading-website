name: Square sandbox deploy (aivatrading.uk)
# Deploys the Square-only checkout to the aiva-trading Pages project and attaches aivatrading.uk + www.
# Square SANDBOX values come from the existing GitHub secrets (never printed); a production token is refused.
# Then runs a real sandbox payment, webhook, duplicate, decline, cancel and refund test. Never enables live payments.
on:
  workflow_dispatch:
  push:
    branches: [devin/1763498400-square-checkout]
permissions:
  contents: read
concurrency:
  group: square-sandbox-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT: aiva-trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local checks
        run: npm test
      - name: Cloudflare diagnostics and attach aivatrading.uk + www
        env:
          DETACH_WORKER_DOMAINS: "1"
        run: python3 scripts/cloudflare-domains.py
      - name: Configure Square sandbox from existing GitHub secrets
        id: square
        env:
          GH_SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          GH_SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          GH_MERCHANT_REFUND_SECRET: ${{ secrets.MERCHANT_REFUND_SECRET }}
          WEBHOOK_URL: https://app.aivatrading.uk/api/square-webhook
          SECRETS_FILE: ${{ runner.temp }}/sq.json
        run: |
          set -euo pipefail
          node scripts/square-sandbox-setup.mjs
          if [ -s "$SECRETS_FILE" ]; then
            npx --yes wrangler@4 pages secret bulk "$SECRETS_FILE" --project-name="$PROJECT" > /dev/null
            echo "Pages production secrets installed (values not printed)."
          fi
      - name: Deploy Pages production
        run: |
          set -euo pipefail
          node scripts/build-pages-assets.mjs
          npx --yes wrangler@4 pages deploy .pages-output --project-name="$PROJECT" --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-message="Square sandbox checkout" --commit-dirty=true
      - name: Verify endpoints
        run: |
          sleep 20
          for h in aivatrading.uk www.aivatrading.uk app.aivatrading.uk aiva-trading.pages.dev; do
            echo "== $h"; curl -s -m 20 -o /tmp/r -w "HTTP %{http_code} %{content_type}\n" "https://$h/api/shop-status"; head -c 700 /tmp/r; echo
            for p in /functions/_lib/commerce.js /wrangler.toml /ORDER-DATABASE-SETUP.sql /_worker.js /scripts/d1-migrate.sh; do
              printf '%s %s\n' "$p" "$(curl -s -m 15 -o /dev/null -w '%{http_code} %{content_type}' "https://$h$p")"
            done
          done
      - name: Square sandbox end-to-end (real sandbox payment, webhook, refunds)
        if: steps.square.outputs.configured == 'true'
        env:
          GH_SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          BASE_URL: https://app.aivatrading.uk
          WEBHOOK_URL: https://app.aivatrading.uk/api/square-webhook
          SECRETS_FILE: ${{ runner.temp }}/sq.json
        run: node scripts/square-sandbox-e2e.mjs
      - name: Remove local secret files
        if: always()
        run: rm -f "$RUNNER_TEMP"/sq.json*
