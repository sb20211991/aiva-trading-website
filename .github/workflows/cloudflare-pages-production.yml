# Deploys the Aiva Trading website to Cloudflare Pages PRODUCTION for aivatrading.uk.
# Uses existing repository secrets CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN.
name: Cloudflare Pages production deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare deploy secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]] && missing+=(CLOUDFLARE_API_TOKEN)
          if ((${#missing[@]})); then
            echo "BLOCKED: missing GitHub secrets: ${missing[*]}"
            exit 1
          fi
          echo "Cloudflare deploy secrets present (values not printed)."
      - name: Run local checks
        run: npm test
      - name: Refuse root worker static upload
        run: |
          set -euo pipefail
          if [[ -f _worker.js ]]; then
            echo "Refusing deploy: _worker.js exists (would be served as static)."
            exit 1
          fi
          test -f functions/api/shop-status.js
      - name: Deploy Cloudflare Pages production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # No --branch flag: Wrangler promotes this deploy to Pages production
          # (custom domain aivatrading.uk). A --branch value creates a preview only.
          echo "Deploying PRODUCTION to Pages project aiva-trading (no preview branch)"
          npx --yes wrangler@4 pages deploy . \
            --project-name=aiva-trading \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Production deploy ${GITHUB_SHA}" \
            --commit-dirty=true
      - name: Verify live shop-status
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            sleep 10
            code=$(curl -sS -o /tmp/shop.json -w '%{http_code}' https://aivatrading.uk/api/shop-status || true)
            echo "Attempt $i HTTP $code"
            head -c 400 /tmp/shop.json || true
            echo
            if [[ "$code" == "200" ]]; then
              python3 - <<'PY'
          import json
          d=json.load(open('/tmp/shop.json'))
          assert isinstance(d, dict), d
          print('shopEnabled=', d.get('shopEnabled'))
          print('publishedProducts=', d.get('publishedProducts'))
          print('merchantReady=', d.get('merchantReady'))
          print('ready=', d.get('ready'))
          print('mode=', d.get('mode'))
          PY
              exit 0
            fi
          done
          echo "WARNING: live /api/shop-status is not HTTP 200 yet after retries"
          exit 1
