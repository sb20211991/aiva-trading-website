name: Cloudflare probe KV R2
on:
  workflow_dispatch:
  push:
    branches: [cursor/cloudflare-github-deploy-1f19]
    paths: ['.github/workflows/cloudflare-probe-kv.yml']
permissions:
  contents: read
jobs:
  probe:
    # Archived: a permissions check must not create KV/R2 resources on a code merge.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe KV/R2 permissions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          def call(method,url,body=None):
            data=None if body is None else json.dumps(body).encode()
            req=urllib.request.Request(url,data=data,method=method,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=60) as res:
                return res.status, json.loads(res.read().decode() or '{}')
            except urllib.error.HTTPError as e:
              return e.code, json.loads(e.read().decode() or '{}')
          for label,url,body in [
            ('kv list', f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces', None),
            ('kv create', f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces', {'title':'aiva-orders-probe'}),
            ('r2 list', f'https://api.cloudflare.com/client/v4/accounts/{account}/r2/buckets', None),
            ('token permission groups hint', 'https://api.cloudflare.com/client/v4/user/tokens/permission_groups', None),
            ('pages project get', f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/aiva-trading', None),
          ]:
            code,payload=call('GET' if body is None else 'POST', url, body)
            print(label, code, json.dumps(payload)[:900])
          PY
