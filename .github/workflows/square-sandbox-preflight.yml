name: Payment deployment preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/square-sandbox-preflight.yml'
      - 'functions/**'
      - 'scripts/**'
      - 'wrangler.toml'
      - 'package.json'
  push:
    branches:
      - cursor/cloudflare-github-deploy-1f19
      - codex/square-sandbox-review
    paths:
      - '.github/workflows/square-sandbox-preflight.yml'
      - 'functions/**'
      - 'scripts/**'
      - 'wrangler.toml'
      - 'package.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build and verification dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Run local checkout and website checks
        run: npm test
      - name: Inspect existing payment resources and domain routing without changing them
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/cloudflare-payment-inventory.py
      - name: Identify Cloudflare Pages project without changing it
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error, sys, tomllib, re
          with open("wrangler.toml", "rb") as config_file:
              repo_config = tomllib.load(config_file)
          selected_provider = repo_config.get("vars", {}).get("CHECKOUT_PROVIDER")
          names = ("CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN")
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              print("BLOCKED: add these encrypted GitHub repository secrets: " + ", ".join(missing))
              print("No Cloudflare configuration or deployment has been changed.")
              sys.exit(1)
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          if len(account) != 32 or any(c not in "0123456789abcdefABCDEF" for c in account):
              print("BLOCKED: invalid Cloudflare account ID format.")
              sys.exit(1)
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          def get(path):
              request = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/accounts/" + account + path,
                  headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  print("Cloudflare API access failed (HTTP " + str(error.code) + ").")
                  try:
                      details = json.load(error)
                      codes = [str(e.get("code")) for e in details.get("errors", [])
                               if isinstance(e.get("code"), int)]
                      print("Cloudflare API error codes: " + ", ".join(codes))
                  except Exception:
                      pass
                  sys.exit(1)
              except Exception:
                  print("Cloudflare API could not be reached. No changes made.")
                  sys.exit(1)
              if result.get("success") is not True:
                  print("Cloudflare rejected the read-only request. No changes made.")
                  sys.exit(1)
              return result
          target = repo_config.get("name", "")
          if not re.fullmatch(r"[a-z0-9-]+", target):
              print("BLOCKED: invalid Pages project name in repository configuration.")
              sys.exit(1)
          project = get("/pages/projects/" + target).get("result") or {}
          if project.get("name") != target:
              print("BLOCKED: Cloudflare returned a different Pages project.")
              sys.exit(1)
          if not any(d in ("aivatrading.uk", "www.aivatrading.uk") for d in project.get("domains", [])):
              print("WARNING: configured Pages project found; apex domain association was not verified.")
          print("Verified Pages project: " + project["name"])
          print("Production branch: " + str(project.get("production_branch")))
          deployment = project.get("canonical_deployment") or {}
          print("Current deployment ID: " + str(deployment.get("id")))
          print("Current deployment URL: " + str(deployment.get("url")))
          keys = ("SQUARE_ACCESS_TOKEN", "SQUARE_LOCATION_ID", "SQUARE_ENVIRONMENT",
                  "SQUARE_WEBHOOK_SIGNATURE_KEY", "SQUARE_WEBHOOK_NOTIFICATION_URL",
                  "MERCHANT_REFUND_SECRET")
          binding = "ORDERS_DB"
          if selected_provider == "stripe":
              keys = ("CHECKOUT_PROVIDER", "STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET",
                      "STRIPE_TEST_CHECKOUT_ENABLED", "STRIPE_TEST_ORIGIN")
              binding = "STRIPE_TEST_ORDERS_DB"
          for environment in ("preview", "production"):
              config = (project.get("deployment_configs") or {}).get(environment) or {}
              variables = config.get("env_vars") or {}
              print(environment + " configuration (values never printed):")
              for key in keys:
                  entry = variables.get(key)
                  print("  " + key + ": " + ("PRESENT (" + str(entry.get("type")) + ")" if entry else "MISSING"))
              databases = config.get("d1_databases") or {}
              print("  " + binding + " binding: " + ("PRESENT" if binding in databases else "MISSING"))
          print("READ-ONLY PREFLIGHT COMPLETE. No deployment, secret update or payment was performed.")
