name: Stripe test integration checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Stripe test flow and existing website
        run: npm test
      - name: Compile Cloudflare Pages Functions without deploying
        run: npx --yes wrangler@4 pages functions build --outdir="$RUNNER_TEMP/aiva-functions"
