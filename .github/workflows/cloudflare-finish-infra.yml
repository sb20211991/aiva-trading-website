# Finish what the agent can do with existing CLOUDFLARE_* GitHub secrets:
# multi-account zone hunt, apex domain poll, D1 ORDERS_DB create+bind,
# set non-secret env + generated MERCHANT_REFUND_SECRET, list existing var names.
# Does NOT invent Square access tokens.
# Redeploy trigger: 2026-11-17T14:37:35Z
name: Cloudflare finish infra
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/cloudflare-github-deploy-1f19
    paths:
      - '.github/workflows/cloudflare-finish-infra.yml'
permissions:
  contents: read
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hunt accounts/zones, D1, env, domain poll
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, secrets, time, urllib.request, urllib.error, urllib.parse
          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token = os.environ['CLOUDFLARE_API_TOKEN'].strip()
          project = 'aiva-trading'
          domain = 'aivatrading.uk'
          hdr = {
            'Authorization': f'Bearer {token}',
            'Content-Type': 'application/json',
            'User-Agent': 'aiva-finish-infra/1.0',
          }

          def call(method, url, body=None, timeout=90):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=hdr)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      raw = res.read().decode()
                      return res.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      payload = json.loads(raw) if raw else {}
                  except Exception:
                      payload = {'raw': raw[:2000]}
                  return e.code, payload

          print('=== Token verify ===')
          code, payload = call('GET', 'https://api.cloudflare.com/client/v4/user/tokens/verify')
          print('verify', code, json.dumps(payload)[:800])

          print('=== Accounts visible to token ===')
          code, payload = call('GET', 'https://api.cloudflare.com/client/v4/accounts?per_page=50')
          print('accounts HTTP', code, 'success', payload.get('success'))
          accounts = payload.get('result') or []
          for a in accounts:
              print(' ACCOUNT', a.get('id'), a.get('name'))

          print('=== Zone ownership probe (POST may reveal existing account) ===')
          code, payload = call('POST', 'https://api.cloudflare.com/client/v4/zones', {
              'name': domain,
              'account': {'id': account},
              'jump_start': False,
          })
          print('zone create probe', code, json.dumps(payload)[:2000])
          # If we accidentally created an empty zone (unlikely when NS already CF elsewhere), leave it.

          print('=== Zone hunt across accounts + global name filter ===')
          code, payload = call('GET', 'https://api.cloudflare.com/client/v4/zones?name=' + urllib.parse.quote(domain))
          print('global zone name filter', code, 'count', len(payload.get('result') or []), json.dumps(payload)[:1200])
          for a in accounts:
              aid = a.get('id')
              code, payload = call('GET', f'https://api.cloudflare.com/client/v4/zones?account.id={aid}&per_page=50')
              print(f'zones in {aid} HTTP', code, 'count', len(payload.get('result') or []))
              for z in payload.get('result') or []:
                  print('  ZONE', z.get('name'), z.get('id'), 'status', z.get('status'))
                  if z.get('name') == domain or domain.endswith(z.get('name') or ''):
                      zid = z['id']
                      c2, p2 = call('GET', f'https://api.cloudflare.com/client/v4/zones/{zid}/dns_records?per_page=100')
                      print('  DNS', c2)
                      for r in p2.get('result') or []:
                          print('   ', r.get('type'), r.get('name'), '->', r.get('content'), 'proxied=', r.get('proxied'))
                      # Ensure www CNAME for Pages
                      need_www = True
                      for r in p2.get('result') or []:
                          if r.get('type') == 'CNAME' and r.get('name') in ('www.aivatrading.uk', 'www') and 'aiva-trading.pages.dev' in (r.get('content') or ''):
                              need_www = False
                      if need_www:
                          print('  Creating www CNAME -> aiva-trading.pages.dev')
                          c3, p3 = call('POST', f'https://api.cloudflare.com/client/v4/zones/{zid}/dns_records', {
                              'type': 'CNAME',
                              'name': 'www',
                              'content': 'aiva-trading.pages.dev',
                              'proxied': True,
                              'ttl': 1,
                          })
                          print('  www create', c3, json.dumps(p3)[:800])
                      # Apex: for CF zone, Pages prefers CNAME flattening to pages.dev
                      has_apex_pages = False
                      for r in p2.get('result') or []:
                          if r.get('name') in (domain, 'aivatrading.uk') and r.get('type') in ('CNAME', 'A', 'AAAA'):
                              print('  apex record exists', r.get('type'), r.get('content'))
                              if r.get('type') == 'CNAME' and 'pages.dev' in (r.get('content') or ''):
                                  has_apex_pages = True
                      if not has_apex_pages:
                          print('  Attempting apex CNAME flattening to aiva-trading.pages.dev')
                          # Delete conflicting A/AAAA first is risky; try CNAME create and report
                          c3, p3 = call('POST', f'https://api.cloudflare.com/client/v4/zones/{zid}/dns_records', {
                              'type': 'CNAME',
                              'name': '@',
                              'content': 'aiva-trading.pages.dev',
                              'proxied': True,
                              'ttl': 1,
                          })
                          print('  apex CNAME', c3, json.dumps(p3)[:1000])

          print('=== Pages project details (env names only) ===')
          code, payload = call('GET', f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}')
          print('project HTTP', code, 'success', payload.get('success'))
          result = payload.get('result') or {}
          print('canonical', result.get('canonical_deployment', {}).get('id'), result.get('canonical_deployment', {}).get('url'))
          print('subdomain', result.get('subdomain'), 'domains', result.get('domains'))
          dc = result.get('deployment_configs') or {}
          for env_name in ('production', 'preview'):
              env = (dc.get(env_name) or {})
              ev = env.get('env_vars') or {}
              print(f'{env_name} env_var names:', sorted(ev.keys()))
              d1s = env.get('d1_databases') or {}
              print(f'{env_name} d1 bindings:', d1s)

          print('=== List D1 databases ===')
          code, payload = call('GET', f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database')
          print('d1 list', code, json.dumps(payload)[:2000])
          dbs = payload.get('result') or []
          orders = next((d for d in dbs if d.get('name') == 'aiva_orders'), None)
          if not orders:
              print('Creating D1 aiva_orders')
              code, payload = call('POST', f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database', {
                  'name': 'aiva_orders',
              })
              print('create d1', code, json.dumps(payload)[:1500])
              orders = (payload.get('result') or {}) if code in (200, 201) else None
          if orders:
              db_id = orders.get('uuid') or orders.get('id')
              print('ORDERS_DB id', db_id)
              # Bind to Pages production + preview
              print('Binding ORDERS_DB on Pages project')
              patch_body = {
                  'deployment_configs': {
                      'production': {
                          'd1_databases': {
                              'ORDERS_DB': {'id': db_id}
                          }
                      },
                      'preview': {
                          'd1_databases': {
                              'ORDERS_DB': {'id': db_id}
                          }
                      },
                  }
              }
              code, payload = call('PATCH', f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}', patch_body)
              print('bind d1 patch', code, json.dumps(payload)[:2000])

              # Apply schema
              sql = open('ORDER-DATABASE-SETUP.sql').read()
              print('Applying D1 schema')
              code, payload = call('POST', f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db_id}/query', {
                  'sql': sql,
              })
              print('schema', code, json.dumps(payload)[:2000])

          print('=== Set agent-owned env vars (no Square tokens invented) ===')
          refund = secrets.token_urlsafe(48)
          # Only set plaintext/known values + generated refund secret.
          # Leave existing Square secrets untouched if already present.
          code, payload = call('GET', f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}')
          result = payload.get('result') or {}
          dc = result.get('deployment_configs') or {}
          prod_vars = dict((dc.get('production') or {}).get('env_vars') or {})
          prev_vars = dict((dc.get('preview') or {}).get('env_vars') or {})

          def upsert(vars_dict, name, value, secret=False):
              existing = vars_dict.get(name)
              if existing and existing.get('type') == 'secret_text':
                  print(f' keep existing secret {name}')
                  return
              if existing and not secret and existing.get('value') == value:
                  print(f' unchanged {name}')
                  return
              vars_dict[name] = {'type': 'secret_text' if secret else 'plain_text', 'value': value}
              print(f' set {name} secret={secret}')

          for vars_dict in (prod_vars, prev_vars):
              upsert(vars_dict, 'SQUARE_ENVIRONMENT', 'sandbox', secret=False)
              upsert(vars_dict, 'SQUARE_WEBHOOK_NOTIFICATION_URL', 'https://app.aivatrading.uk/api/square-webhook', secret=False)
              if 'MERCHANT_REFUND_SECRET' not in vars_dict:
                  upsert(vars_dict, 'MERCHANT_REFUND_SECRET', refund, secret=True)
              else:
                  print(' keep existing MERCHANT_REFUND_SECRET')

          patch_body = {
              'deployment_configs': {
                  'production': {'env_vars': prod_vars},
                  'preview': {'env_vars': prev_vars},
              }
          }
          code, payload = call('PATCH', f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}', patch_body)
          print('env patch', code, 'success', payload.get('success'))
          if not payload.get('success'):
              print(json.dumps(payload)[:2500])
          else:
              ev = ((payload.get('result') or {}).get('deployment_configs') or {}).get('production', {}).get('env_vars') or {}
              print('production env names after:', sorted(ev.keys()))

          print('=== Domains status + long poll ===')
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/domains'
          for i in range(1, 13):
              code, payload = call('GET', base)
              domains = payload.get('result') or []
              apex = next((d for d in domains if d.get('name') == domain), None)
              print(f'poll {i}', 'apex=', None if not apex else {k: apex.get(k) for k in ('status', 'verification_data', 'validation_data')})
              if apex and apex.get('status') == 'active':
                  print('APEX_DOMAIN_ACTIVE')
                  break
              if not apex:
                  print('apex missing; creating')
                  call('POST', base, {'name': domain})
              time.sleep(15)
          else:
              print('APEX_STILL_NOT_ACTIVE')

          code, payload = call('GET', base)
          print('final domains', json.dumps(payload.get('result'), indent=2)[:4000])
          PY
      - name: Try wrangler D1 create + bind (if token allows)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          npx --yes wrangler@4 d1 list 2>&1 | tee /tmp/d1-list.txt
          npx --yes wrangler@4 d1 create aiva_orders 2>&1 | tee /tmp/d1-create.txt
          # Extract uuid if created or already exists
          DB_ID=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path('/tmp/d1-create.txt').read_text() + '\n' + pathlib.Path('/tmp/d1-list.txt').read_text()
          m = re.search(r'([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})', text, re.I)
          print(m.group(1) if m else '')
          PY
          )
          echo "DB_ID=${DB_ID}"
          if [[ -n "$DB_ID" ]]; then
            npx --yes wrangler@4 d1 execute aiva_orders --remote --file=ORDER-DATABASE-SETUP.sql 2>&1 | tee /tmp/d1-sql.txt || true
            export DB_ID
            python3 <<'PY'
          import json, os, urllib.request, urllib.error
          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token = os.environ['CLOUDFLARE_API_TOKEN'].strip()
          db_id = os.environ['DB_ID'].strip()
          body = json.dumps({
              'deployment_configs': {
                  'production': {'d1_databases': {'ORDERS_DB': {'id': db_id}}},
                  'preview': {'d1_databases': {'ORDERS_DB': {'id': db_id}}},
              }
          }).encode()
          req = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/aiva-trading',
              data=body, method='PATCH',
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  print(res.read().decode()[:2000])
          except urllib.error.HTTPError as e:
              print('bind failed', e.code, e.read().decode()[:1500])
          PY
          else
            echo 'No D1 database id available from this token'
          fi
          exit 0
      - name: Redeploy production after bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm test
          test ! -f _worker.js
          npx --yes wrangler@4 pages deploy . \
            --project-name=aiva-trading \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Finish infra ${GITHUB_SHA}" \
            --commit-dirty=true
      - name: Re-apply Pages env after wrangler (deploy can wipe plain vars)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, secrets, urllib.request, urllib.error
          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token = os.environ['CLOUDFLARE_API_TOKEN'].strip()
          project = 'aiva-trading'
          hdr = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def call(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=hdr)
              try:
                  with urllib.request.urlopen(req, timeout=60) as res:
                      return res.status, json.loads(res.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or '{}')

          code, payload = call('GET', f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}')
          assert code == 200 and payload.get('success'), payload
          dc = (payload.get('result') or {}).get('deployment_configs') or {}
          prod = dict((dc.get('production') or {}).get('env_vars') or {})
          prev = dict((dc.get('preview') or {}).get('env_vars') or {})
          print('before names', sorted(prod.keys()), sorted(prev.keys()))

          def ensure(vars_dict, name, value, secret=False):
              existing = vars_dict.get(name)
              if existing and existing.get('type') == 'secret_text' and secret:
                  # keep existing secret value
                  return
              if existing and existing.get('type') == 'secret_text' and not secret:
                  # replace secret with plain if we intentionally want plain
                  pass
              vars_dict[name] = {
                  'type': 'secret_text' if secret else 'plain_text',
                  'value': value,
              }

          refund = secrets.token_urlsafe(48)
          for vars_dict in (prod, prev):
              ensure(vars_dict, 'SQUARE_ENVIRONMENT', 'sandbox', secret=False)
              ensure(vars_dict, 'SQUARE_WEBHOOK_NOTIFICATION_URL', 'https://app.aivatrading.uk/api/square-webhook', secret=False)
              if 'MERCHANT_REFUND_SECRET' not in vars_dict:
                  ensure(vars_dict, 'MERCHANT_REFUND_SECRET', refund, secret=True)

          code, payload = call('PATCH', f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}', {
              'deployment_configs': {
                  'production': {'env_vars': prod},
                  'preview': {'env_vars': prev},
              }
          })
          print('reapply', code, 'success', payload.get('success'))
          ev = ((payload.get('result') or {}).get('deployment_configs') or {}).get('production', {}).get('env_vars') or {}
          print('after production names', sorted(ev.keys()))
          if not payload.get('success'):
              raise SystemExit(json.dumps(payload)[:2000])
          PY
      - name: Verify live surfaces
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; AivaAgent/1.0)'
          for u in \
            https://app.aivatrading.uk/api/shop-status \
            https://aiva-trading.pages.dev/api/shop-status \
            https://aivatrading.uk/api/shop-status
          do
            echo "==== $u ===="
            code=$(curl -sS -o /tmp/s.json -w '%{http_code}' -A "$UA" --max-time 25 "$u" || echo ERR)
            echo "HTTP $code"
            head -c 400 /tmp/s.json || true
            echo
          done
          code=$(curl -sS -o /tmp/app.json -w '%{http_code}' -A "$UA" --max-time 25 https://app.aivatrading.uk/api/shop-status)
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/app.json'))
          print('app shop-status', d)
          assert d.get('shopEnabled') is True
          print('orderDatabaseConfigured', d.get('orderDatabaseConfigured'))
          print('merchantReady', d.get('merchantReady'))
          print('webhookConfigured', d.get('webhookConfigured'))
          PY
          # Apex may still be pending DNS in another CF account — do not fail the job for that alone.
          apex=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" --max-time 25 https://aivatrading.uk/api/shop-status || true)
          echo "apex_shop_status_http=$apex"
# Trigger workflow Tue Nov 17 02:15:39 AM UTC 2026
