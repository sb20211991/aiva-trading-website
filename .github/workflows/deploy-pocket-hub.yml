name: Deploy Aiva Pocket Hub (app.aivatrading.uk)
# Deploys pocket-hub/public to the aiva-pocket-hub Pages project only. Never touches the aiva-trading website project.
# Pull requests: preview deploy. main: production deploy, then move app.aivatrading.uk (only) to Pocket Hub with rollback.
on:
  workflow_dispatch:
  pull_request:
    paths: ['pocket-hub/**', '.github/workflows/deploy-pocket-hub.yml']
  push:
    branches: [main]
    paths: ['pocket-hub/**', '.github/workflows/deploy-pocket-hub.yml']
permissions:
  contents: read
  deployments: write
concurrency:
  group: deploy-pocket-hub-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: aiva-pocket-hub
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: pocket-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Split Aiva Search fields (build step)
        run: node scripts/split-search-fields.mjs
      - name: Add the Aiva Train and Aiva Tram sections (build step)
        run: node scripts/add-rail-sections.mjs
      - name: Add the Aiva Car Rental section (build step)
        run: node scripts/add-car-section.mjs
      - name: Place search results under their search sections (build step)
        run: node scripts/add-results-ux.mjs
      # Aiva Train and Aiva Tram: the phone checkout and the smaller train mark. The gzipped patch is applied from
      # the repository root, before the tests, so the deployed files and the tests always run identical code.
      - name: Aiva Train checkout for phones (build step)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          gunzip -c pocket-hub/scripts/rail-checkout-ui.patch.gz > "$RUNNER_TEMP/rail-checkout-ui.patch"
          # Idempotent: the patch's result is committed in the repository, so skip when it is already applied.
          if git apply --reverse --check "$RUNNER_TEMP/rail-checkout-ui.patch" 2>/dev/null; then
            echo "rail checkout patch already applied"
          else
            git apply "$RUNNER_TEMP/rail-checkout-ui.patch"
          fi
      - name: Test
        run: node test/hub-test.mjs && node test/transport-plan-test.mjs && node test/rail-test.mjs && node test/car-test.mjs && node test/car-middleware-test.mjs && node test/ferry-test.mjs && node test/bike-baggage-test.mjs && node test/flight-extras-test.mjs && node test/finance-test.mjs && node test/pay-test.mjs
      # Provider keys live in repository secrets and are pushed to the Pages project here, so no key is ever written to
      # a file, a log or the repository. TfL's anonymous quota is metered per IP, and Cloudflare's shared egress is
      # frequently over it, so a free TfL app key is what makes London live boards reliable. The car rental gateway is
      # switched on the same way: set CAR_RENTAL_GATEWAY_URL and CAR_RENTAL_GATEWAY_KEY once the supplier is signed.
      # Missing keys are skipped, and without them Aiva Car Rental stays honestly closed.
      - name: Apply provider keys from repository secrets
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          RAIL_DATA_LDB_KEY: ${{ secrets.RAIL_DATA_LDB_KEY }}
          CAR_RENTAL_GATEWAY_URL: ${{ secrets.CAR_RENTAL_GATEWAY_URL }}
          CAR_RENTAL_GATEWAY_KEY: ${{ secrets.CAR_RENTAL_GATEWAY_KEY }}
          CAR_RENTAL_PROVIDER: ${{ secrets.CAR_RENTAL_PROVIDER }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # Aiva Pay: Stripe (card, Apple Pay, Google Pay, Alipay, WeChat Pay) and BitPay (Bitcoin and crypto).
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          BITPAY_TOKEN: ${{ secrets.BITPAY_TOKEN }}
          BITPAY_ENV: ${{ secrets.BITPAY_ENV }}
        run: |
          set -euo pipefail
          for name in TFL_APP_KEY RAIL_DATA_LDB_KEY CAR_RENTAL_GATEWAY_URL CAR_RENTAL_GATEWAY_KEY CAR_RENTAL_PROVIDER COINGECKO_API_KEY STRIPE_SECRET_KEY BITPAY_TOKEN BITPAY_ENV; do
            value="${!name:-}"
            if [ -z "$value" ]; then echo "$name: not set in repository secrets, skipping"; continue; fi
            printf '%s' "$value" | npx --yes wrangler@4 pages secret put "$name" --project-name="$PROJECT" > /dev/null
            echo "$name: applied to the Cloudflare Pages project"
          done
      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then BRANCH="pr-${{ github.event.pull_request.number }}"; else BRANCH=main; fi
          npx --yes wrangler@4 pages deploy public --project-name="$PROJECT" --branch="$BRANCH" \
            --commit-hash="$GITHUB_SHA" --commit-message="Pocket Hub ${GITHUB_SHA::7}" --commit-dirty=true | tee "$RUNNER_TEMP/deploy.log"
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)" >> "$GITHUB_OUTPUT"
      # A freshly uploaded Pages deployment can answer 404 or serve the previous build for a few seconds while the
      # project alias catches up, so probes retry with a cap. Files are fetched to disk rather than piped into
      # grep -q: under pipefail, grep closing the pipe early makes curl exit 23 and would fail a passing check.
      - name: Verify deployment
        run: |
          set -euo pipefail
          U="${{ steps.deploy.outputs.url }}"; [ "${{ github.event_name }}" = "pull_request" ] || U="https://$PROJECT.pages.dev"
          echo "== $U"
          retry() { # retry <description> <attempts> <command...>
            local what="$1" n="$2"; shift 2
            for i in $(seq 1 "$n"); do
              if "$@"; then echo "$what: ok (attempt $i)"; return 0; fi
              echo "$what: attempt $i failed, waiting"; sleep 8
            done
            echo "$what: FAILED after $n attempts"; return 1
          }
          home() { curl -sf -m 20 -o "$RUNNER_TEMP/app.html" "$U/" && grep -qF '<meta name="application-name" content="Aiva">' "$RUNNER_TEMP/app.html"; }
          retry 'home page' 8 home
          grep -q 'id="asForm"' "$RUNNER_TEMP/app.html"
          grep -q 'id="asRailTrain"' "$RUNNER_TEMP/app.html"
          grep -q 'id="asCar"' "$RUNNER_TEMP/app.html"
          grep -q 'src="aiva-car.js"' "$RUNNER_TEMP/app.html"
          for p in /app.js /aiva-rail.js /aiva-car.js /vendor/qrcode.js /service-worker.js /manifest.webmanifest /icon-192.png; do
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$U$p")
            printf '%s %s\n' "$p" "$code"
            [ "$code" = '200' ] || { echo "$p is $code"; exit 1; }
          done
          printf '/api/shop-status (forwarded to website) %s\n' "$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$U/api/shop-status")"
          # The build steps above must actually reach the CDN: no checkout rewrite, no release.
          curl -sf -m 30 -o "$RUNNER_TEMP/aiva-rail.js" "$U/aiva-rail.js"
          grep -q 'rail-checkout-head' "$RUNNER_TEMP/aiva-rail.js"
          curl -sf -m 30 -o "$RUNNER_TEMP/aiva-car.js" "$U/aiva-car.js"
          grep -q 'cr-form' "$RUNNER_TEMP/aiva-car.js"
          # Car hire must answer with the honest no-supplier state: never an error, never invented cars or prices.
          car_api() {
            local body
            body=$(curl -sf -m 30 "$U/api/car?action=search&pickup=Heathrow&from=2026-12-01T10:00:00Z&to=2026-12-05T10:00:00Z&age=35") || return 1
            case "$body" in *'"available":false'*) return 0 ;; *) echo "car api: $body" | head -c 300; return 1 ;; esac
          }
          retry 'car rental api' 4 car_api
          # Aiva Finance: real provider replies through the deployed functions. Currencies must cover the world
          # (100+ codes, IQD included); crypto must list priced coins. Values are never invented.
          fx_api() {
            curl -sf -m 30 -o "$RUNNER_TEMP/fx.json" "$U/api/finance/fx?base=GBP" || return 1
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));n=len(d['rates']);s={v for v in d['sources'].values()};print('fx:',n,'currencies, sources',sorted(s),'live',d.get('live'));sys.exit(0 if n>=100 and 'IQD' in d['rates'] and 'USD' in d['rates'] else 1)" "$RUNNER_TEMP/fx.json"
          }
          retry 'finance fx api' 4 fx_api
          crypto_api() {
            curl -sf -m 30 -o "$RUNNER_TEMP/crypto.json" "$U/api/finance/crypto?currency=GBP&limit=50" || return 1
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));c=d['coins'];print('crypto:',len(c),'coins from',d['source'],'BTC',next((x['price'] for x in c if x['symbol']=='BTC'),None));sys.exit(0 if len(c)>=10 and c[0]['price']>0 else 1)" "$RUNNER_TEMP/crypto.json"
          }
          retry 'finance crypto api' 4 crypto_api
          curl -sf -m 30 -o "$RUNNER_TEMP/aiva-finance.js" "$U/aiva-finance.js" && grep -q 'afCcFrom' "$RUNNER_TEMP/aiva-finance.js"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print('fx options:',d['count'],d.get('counts'))" "$RUNNER_TEMP/fx.json"
          # Aiva Pay: the checkout script is served and every method reports its real state (never an error page).
          curl -sf -m 30 -o "$RUNNER_TEMP/aiva-pay.js" "$U/aiva-pay.js" && grep -q 'data-ap-method' "$RUNNER_TEMP/aiva-pay.js"
          pay_api() {
            curl -sf -m 30 -o "$RUNNER_TEMP/pay.json" "$U/api/pay/methods" || return 1
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));m=d['methods'];print('pay: open',d['open'],'products',len(d['products']));[print(' ',x['id'],'available' if x['available'] else 'off: '+x['reason']) for x in m];sys.exit(0 if len(m)==6 else 1)" "$RUNNER_TEMP/pay.json"
          }
          retry 'aiva pay methods api' 4 pay_api
          U="$U" python3 ../scripts/pocket-hub-health.py
      # Apple Pay on Aiva's own Stripe account: register app.aivatrading.uk as a payment method domain (Stripe serves
      # the Apple Pay domain verification itself; the association file is also hosted under /.well-known). Idempotent,
      # skipped without a Stripe key, and never fails the release.
      - name: Register app.aivatrading.uk for Apple Pay with Stripe
        if: github.event_name != 'pull_request'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then echo "STRIPE_SECRET_KEY not set: Apple Pay domain registration skipped"; exit 0; fi
          A=(-s -m 30 -u "$STRIPE_SECRET_KEY:" -H 'Stripe-Version: 2024-06-20')
          id=$(curl "${A[@]}" "https://api.stripe.com/v1/payment_method_domains?domain_name=app.aivatrading.uk" | python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or [];print(d[0]['id'] if d else '')")
          if [ -z "$id" ]; then
            id=$(curl "${A[@]}" -X POST https://api.stripe.com/v1/payment_method_domains -d domain_name=app.aivatrading.uk -d enabled=true | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          fi
          [ -n "$id" ] || { echo "Stripe did not register the domain (check the Stripe Dashboard)"; exit 0; }
          curl "${A[@]}" -X POST "https://api.stripe.com/v1/payment_method_domains/$id/validate" | python3 -c "import json,sys;d=json.load(sys.stdin);print('Apple Pay domain:',d.get('domain_name'),(d.get('apple_pay') or {}).get('status'),(d.get('apple_pay') or {}).get('status_details') or '');print('Google Pay:',(d.get('google_pay') or {}).get('status'))"
          exit 0
      - name: Move app.aivatrading.uk to Pocket Hub (with rollback)
        if: github.event_name != 'pull_request'
        run: python3 scripts/move-app-domain.py
