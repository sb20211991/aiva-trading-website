name: Deploy Aiva Pocket Hub (app.aivatrading.uk)
# Deploys pocket-hub/public to the aiva-pocket-hub Pages project only. Never touches the aiva-trading website project.
# Pull requests: preview deploy. main: production deploy, then move app.aivatrading.uk (only) to Pocket Hub with rollback.
on:
  workflow_dispatch:
  pull_request:
    paths: ['pocket-hub/**', '.github/workflows/deploy-pocket-hub.yml']
  push:
    branches: [main]
    paths: ['pocket-hub/**', '.github/workflows/deploy-pocket-hub.yml']
permissions:
  contents: read
  deployments: write
concurrency:
  group: deploy-pocket-hub-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: aiva-pocket-hub
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: pocket-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Aiva Train and Aiva Tram draw a ticket QR code on the device. The generator is a pinned, MIT-licensed
      # dependency vendored here at build time, so every deploy uses the same version and the repository keeps no
      # minified third-party blob. It is created before the tests, which check that it still renders a matrix.
      - name: Vendor the offline QR generator (qrcode-generator 1.4.4, MIT)
        run: |
          set -euo pipefail
          mkdir -p public/vendor
          npm pack qrcode-generator@1.4.4 --silent >/dev/null
          tar -xzf qrcode-generator-1.4.4.tgz
          { printf '%s\n' '/* qrcode-generator 1.4.4 - MIT licence, Copyright (c) 2009 Kazuhiko Arase (http://www.d-project.com/).' '   Vendored so Aiva draws a ticket QR code on the device, with no third-party image service. */'; cat package/qrcode.js; } > public/vendor/qrcode.js
          rm -rf package qrcode-generator-1.4.4.tgz
          test -s public/vendor/qrcode.js
      - name: Split Aiva Search fields (build step)
        run: node scripts/split-search-fields.mjs
      - name: Add the Aiva Train and Aiva Tram sections (build step)
        run: node scripts/add-rail-sections.mjs
      - name: Add the Aiva Car Rental section (build step)
        run: node scripts/add-car-section.mjs
      - name: Place search results under their search sections (build step)
        run: node scripts/add-results-ux.mjs
      # Aiva Train and Aiva Tram: the phone checkout and the smaller train mark. The gzipped patch is applied from
      # the repository root, before the tests, so the deployed files and the tests always run identical code.
      - name: Aiva Train checkout for phones (build step)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          gunzip -c pocket-hub/scripts/rail-checkout-ui.patch.gz > "$RUNNER_TEMP/rail-checkout-ui.patch"
          git apply "$RUNNER_TEMP/rail-checkout-ui.patch"
      - name: Test
        run: node test/hub-test.mjs && node test/transport-plan-test.mjs && node test/rail-test.mjs && node test/car-test.mjs && node test/car-middleware-test.mjs
      # Provider keys live in repository secrets and are pushed to the Pages project here, so no key is ever written to
      # a file, a log or the repository. TfL's anonymous quota is metered per IP, and Cloudflare's shared egress is
      # frequently over it, so a free TfL app key is what makes London live boards reliable. The car rental gateway is
      # switched on the same way: set CAR_RENTAL_GATEWAY_URL and CAR_RENTAL_GATEWAY_KEY once the supplier is signed.
      # Missing keys are skipped, and without them Aiva Car Rental stays honestly closed.
      - name: Apply provider keys from repository secrets
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          RAIL_DATA_LDB_KEY: ${{ secrets.RAIL_DATA_LDB_KEY }}
          CAR_RENTAL_GATEWAY_URL: ${{ secrets.CAR_RENTAL_GATEWAY_URL }}
          CAR_RENTAL_GATEWAY_KEY: ${{ secrets.CAR_RENTAL_GATEWAY_KEY }}
          CAR_RENTAL_PROVIDER: ${{ secrets.CAR_RENTAL_PROVIDER }}
        run: |
          set -euo pipefail
          for name in TFL_APP_KEY RAIL_DATA_LDB_KEY CAR_RENTAL_GATEWAY_URL CAR_RENTAL_GATEWAY_KEY CAR_RENTAL_PROVIDER; do
            value="${!name:-}"
            if [ -z "$value" ]; then echo "$name: not set in repository secrets, skipping"; continue; fi
            printf '%s' "$value" | npx --yes wrangler@4 pages secret put "$name" --project-name="$PROJECT" > /dev/null
            echo "$name: applied to the Cloudflare Pages project"
          done
      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then BRANCH="pr-${{ github.event.pull_request.number }}"; else BRANCH=main; fi
          npx --yes wrangler@4 pages deploy public --project-name="$PROJECT" --branch="$BRANCH" \
            --commit-hash="$GITHUB_SHA" --commit-message="Pocket Hub ${GITHUB_SHA::7}" --commit-dirty=true | tee "$RUNNER_TEMP/deploy.log"
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Verify deployment
        run: |
          set -euo pipefail
          sleep 10
          U="${{ steps.deploy.outputs.url }}"; [ "${{ github.event_name }}" = "pull_request" ] || U="https://$PROJECT.pages.dev"
          echo "== $U"
          curl -sf -m 30 -o "$RUNNER_TEMP/app.html" "$U/"; grep -qF '<meta name="application-name" content="Aiva">' "$RUNNER_TEMP/app.html"
          for p in /app.js /aiva-rail.js /aiva-car.js /vendor/qrcode.js /service-worker.js /manifest.webmanifest /icon-192.png; do printf '%s %s\n' "$p" "$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$U$p")"; done
          printf '/api/shop-status (forwarded to website) %s\n' "$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$U/api/shop-status")"
          grep -q 'id="asForm"' "$RUNNER_TEMP/app.html"
          grep -q 'id="asRailTrain"' "$RUNNER_TEMP/app.html"
          grep -q 'id="asCar"' "$RUNNER_TEMP/app.html"
          # The build steps above must actually reach the CDN: no checkout rewrite, no release.
          curl -sf -m 30 "$U/aiva-rail.js" | grep -q 'rail-checkout-head'
          curl -sf -m 30 "$U/aiva-car.js" | grep -q 'cr-form'
          # Car hire must answer with the honest no-supplier state: never an error, never invented cars or prices.
          curl -sf -m 30 "$U/api/car?action=search&pickup=Heathrow&from=2026-12-01T10:00:00Z&to=2026-12-05T10:00:00Z&age=35" | grep -q '"available":false'
          U="$U" python3 ../scripts/pocket-hub-health.py
      - name: Move app.aivatrading.uk to Pocket Hub (with rollback)
        if: github.event_name != 'pull_request'
        run: python3 scripts/move-app-domain.py
