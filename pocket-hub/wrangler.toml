# Aiva Pocket Hub super app (original v1.0 recovered from Worker winter-water-9e14): Pages project aiva-pocket-hub,
# served at app.aivatrading.uk. Independent of the Aiva Trading website (Pages project aiva-trading, aivatrading.uk + www).
# Deployed only by .github/workflows/deploy-pocket-hub.yml.
name = "aiva-pocket-hub"
compatibility_date = "2025-11-01"
pages_build_output_dir = "public"

[vars]
# Website API paths that still arrive on app.aivatrading.uk (e.g. the Square webhook) are forwarded here.
WEBSITE_ORIGIN = "https://aiva-trading.pages.dev"

# Aiva Translate video and live speech recognition: OpenAI Whisper large-v3-turbo on Cloudflare Workers AI.
# Usage is metered by Cloudflare (free daily allocation, then about $0.0005 per audio minute on a paid Workers plan).
# Pages does not inherit bindings into env sections, so it is repeated below. Set AIVA_STT_ENABLED = "false" to turn it off.
[ai]
binding = "AI"

# Production only: real Nuitee bookings and card payments. Previews keep the sandbox key, which never charges.
# Pages does not inherit top-level [vars] into env sections, so WEBSITE_ORIGIN is repeated.
[env.production.vars]
WEBSITE_ORIGIN = "https://aiva-trading.pages.dev"
HOTEL_BOOKING_LIVE = "true"
FLIGHT_BOOKING_LIVE = "true"
# Paid seats and extra bags with the live key: off until a Nuitee sandbox run of the attach flow passes.
FLIGHT_EXTRAS_LIVE = "false"
# Aiva Pay (card, Apple Pay, Google Pay, Alipay, WeChat Pay via Stripe; crypto via BitPay): live keys take real payments
# only here. Preview deployments never set this, so a live key there stays closed.
AIVA_PAY_LIVE = "true"

[env.production.ai]
binding = "AI"
